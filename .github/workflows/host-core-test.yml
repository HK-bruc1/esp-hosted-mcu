# .github/workflows/host-core-test.yml
#
# Three-tier CI for host core layer:
#   Tier 1: Phase 1 portable-boundary isolation check (30s)
#   Tier 2: Linux mock tests — 13/13 core files compile, 13/13 linked,
#            13/13 with production-path test coverage (3min)
#   Tier 3: ESP-IDF slave build matrix (30min)
#
# All jobs run on ubuntu-latest with zero hardware dependencies.

name: Host Core Test

on:
  push:
    paths:
      - 'host/core/**'
      - 'host/port/include/**'
      - 'host/port/linux/**'
      - 'host/port/esp-idf/**'
      - 'common/proto/**'
      - 'common/transport/**'
      - 'common/mempool/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/host-core-test.yml'
  pull_request:
    paths:
      - 'host/core/**'
      - 'host/port/**'
      - 'common/proto/**'
      - 'tests/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:

  # ── Tier 1: Compile Isolation Check (30s) ──
  isolation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Check Phase 1 portable boundary is ESP-IDF free
        run: bash scripts/check_core_isolation.sh

      - name: Verify all core files are platform-agnostic (no ESP-IDF dependency)
        run: |
          INC_FLAGS=(
            -I host/core/include/h_public
            -I host/core/include/h_internal
            -I host/port/include
            -I host/port/linux
            -I tests/stubs
            -I common/mempool/include
            -I common/transport
            -I common
            -I host/api/include
            -I host/drivers/transport
            -I host/drivers/rpc/core
            -I host/drivers/rpc/slaveif
            -I host/drivers/virtual_serial_if
            -I host/drivers/serial
            -I host/drivers/rpc/wrap
            -I common/proto
            -I common/protobuf-c
            -I common/rpc
            -I common/log
            -I common/utils
            -I host/drivers/bt
            -I host/port/esp-idf
          )
          for f in host/core/src/*.c; do
            echo "Checking $f..."
            gcc -fsyntax-only \
              "${INC_FLAGS[@]}" \
              -Wall -Werror \
              "$f"
          done

  # ── Tier 2: Linux Mock Tests (3min) ──
  linux-mock-test:
    runs-on: ubuntu-latest
    needs: isolation-check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # Need protobuf-c

      - name: Create build directory
        run: mkdir -p build

      - name: Run Linux mock test script
        run: bash scripts/run_linux_mock_tests.sh

  # ── Tier 3: ESP-IDF Slave Build Matrix (30min) ──
  # Only compiles slave firmware; host build tested in hardware regression.
  esp-idf-build-matrix:
    runs-on: ubuntu-latest
    needs: linux-mock-test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c6]
        transport: [sdio, spi, uart]
        idf_version: [v5.3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build slave (${{ matrix.target }}, ${{ matrix.transport }}, IDF ${{ matrix.idf_version }})
        uses: espressif/esp-idf-ci-action@v2
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: ${{ matrix.target }}
          command: |
            cd slave
            idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.${{ matrix.transport }}" build

  # ── Tier 3 (supplement): ESP-IDF Host Build Verification ──
  # Verifies ESP-IDF port files are compilable within IDF toolchain context.
  esp-idf-host-build:
    runs-on: ubuntu-latest
    needs: linux-mock-test
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        transport: [spi]
        idf_version: [v5.3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify ESP-IDF port files compile (syntax check)
        uses: espressif/esp-idf-ci-action@v2
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: esp32c6
          command: |
            # Syntax-check ESP-IDF port source files against IDF includes
            # Using esp32c6 (RISC-V) as a stable target
            for f in host/port/esp-idf/*.c; do
              echo "Checking $f..."
              riscv32-esp-elf-gcc -fsyntax-only \
                -I host/core/include/h_public \
                -I host/port/include \
                -I host/port/esp-idf \
                -I common/transport \
                -I common/mempool/include \
                -I host/api/include \
                -I ${IDF_PATH}/components/freertos/FreeRTOS-Kernel/include \
                -I ${IDF_PATH}/components/freertos/esp_additions/include/freertos \
                -I ${IDF_PATH}/components/esp_hw_support/include \
                -I ${IDF_PATH}/components/esp_common/include \
                -I ${IDF_PATH}/components/esp_rom/include \
                -I ${IDF_PATH}/components/esp_system/include \
                -I ${IDF_PATH}/components/esp_timer/include \
                -I ${IDF_PATH}/components/hal/include \
                -I ${IDF_PATH}/components/soc/include \
                -I ${IDF_PATH}/components/soc/esp32c6/include \
                -I ${IDF_PATH}/components/log/include \
                -I ${IDF_PATH}/components/heap/include \
                -I ${IDF_PATH}/components/newlib/platform_include \
                -I ${IDF_PATH}/components/esp_driver_spi/include \
                -I ${IDF_PATH}/components/esp_driver_gpio/include \
                -I ${IDF_PATH}/components/esp_wifi/include \
                "$f" || { echo "  [ERROR] Syntax check failed — fix before merge"; exit 1; }
            done
